name: Keep Supabase project alive

# Supabase free-tier projects auto-pause after 7 days with no activity.
# This workflow runs a trivial read query every few days to keep the
# project active. Requires SUPABASE_URL and SUPABASE_ANON_KEY to be set
# as repository secrets (Settings -> Secrets and variables -> Actions).

on:
  schedule:
    - cron: '0 8 */3 * *' # every 3 days at 08:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping categories table
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase responded with status $status"

          if [ "$status" -ge 400 ]; then
            echo "Keep-alive ping failed"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
